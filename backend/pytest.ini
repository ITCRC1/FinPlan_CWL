; Qué se colecta cuando se corre `pytest` desde `backend/`.
;
; Por qué existe (2026-08-21): sin `testpaths`, pytest barre TODO `backend/` y
; se lleva por delante `scripts/borrar_linea_kpi_test.py` — un script de un solo
; uso que termina en `_test.py` y por eso calza con el patrón por defecto
; (`test_*.py` o `*_test.py`). Ese script llama a `usar_produccion()` AL
; IMPORTARSE, que sin `DATABASE_URL` abre una ruta cacheada de otra máquina
; (`C:/Users/finco/...`) y revienta con FileNotFoundError.
;
; El daño no es una prueba roja sino un ERROR DE COLECCIÓN: pytest aborta con
; «Interrupted: N errors during collection» y NO corre ninguna de las 3,671
; pruebas. En el CI —que corre `python -m pytest -q` sin `DATABASE_URL`, a
; propósito— eso deja el suite entero sin ejecutar.
;
; `scripts/` es herramienta de operación, no de prueba: se corre a mano y contra
; la base de producción. No tiene por qué estar en el barrido.
[pytest]
testpaths = tests
